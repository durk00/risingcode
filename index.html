<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outside In">
<!-- V73: the home-screen icon, William's amber code face, cropped to the face (180 by 180; the iPad rounds the corners) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">   <!-- V91: so a Chromebook or Android fills the whole icon shape with the face, no white ring -->
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<title>Outside In</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* One full-screen canvas; nothing else on the page but a hint that fades. Deliberately single dark look. */
  :root {
    --void: #000000;     /* the background */
    --ice: #46b8e6;      /* cyan-blue streams */
    --leaf: #3fe08f;     /* green streams */
    --ember: #ff5059;
    --snow: #ffffff;     /* Santa's fur trim, beard and runners: pure white, not the blue-white of the rain */
    --tan: #c99a68;      /* reindeer */
    --antler: #9a6a42;   /* antlers and harness, darker brown */
    --halo: #ffe7a3;     /* the star's warm glow */    /* red streams: darker than the green, so the two differ in brightness too */
    --frost: #dff4ff;    /* pale streams and the bright leading glyph */
    --hint: #8fa9b8;     /* the fading tap hint */
    --mono: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Osaka", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--frost); overflow: hidden; }
  /* Home-screen app on an iPhone or iPad (Nov 23): the page starts under the status bar, but
     iOS reports the screen as shorter by the status bar's height, which left an empty black
     band at the bottom. The canvas reaches that much further down, and is drawn at its real size. */
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: calc(100vh + env(safe-area-inset-top, 0px)); min-height: 100%; display: block; background: var(--void); }
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center; font: 500 13px/1.4 var(--mono); letter-spacing: 0.12em;
    color: var(--hint); opacity: 0.9; transition: opacity 2s ease; pointer-events: none;
    text-shadow: 0 0 6px #000, 0 0 2px #000;   /* readable over the Winter scene's snow too */
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="rain" aria-label="Rising columns of glowing code in blue, green and white, with a red Christmas tree, a pulsing star, Santa's sleigh flying past now and then, and a thin radar line sweeping around"></canvas>
<!-- The version shows in the hint for five seconds, so an old cached copy is easy to spot (Nov 23). -->
<div id="hint">TAP FOR SOUND · SWIPE LEFT FOR WINTER · DOWN FOR MENU · V91</div>

<script src="place.js"></script>
<script src="skypath.js"></script>
<script src="wxnow.js"></script>
<script src="wildlife.js"></script>
<script src="homestead.js"></script>
<script src="winter.js"></script>
<script src="details.js"></script>
<script src="debris.js"></script>
<script src="lights.js"></script>
<script src="sat.js"></script>
<script src="clouds.js"></script>
<script src="earth.js"></script>
<script src="face.js"></script>
<script src="mealdb.js"></script>
<script src="kitchen.js"></script>
<script src="gpage.js"></script>
<script src="verses.js"></script>
<script src="tv.js"></script>
<script src="radio.js"></script>
<script src="howto.js"></script>
<script src="menu.js"></script>
<script src="nightclock.js"></script>
<script src="firstrun.js"></script>
<script>
(() => {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const css = getComputedStyle(document.documentElement);
  const C = {
    void: css.getPropertyValue('--void').trim(),
    ice: css.getPropertyValue('--ice').trim(),
    leaf: css.getPropertyValue('--leaf').trim(),
    ember: css.getPropertyValue('--ember').trim(),
    halo: css.getPropertyValue('--halo').trim(),
    snow: css.getPropertyValue('--snow').trim(),
    tan: css.getPropertyValue('--tan').trim(),
    antler: css.getPropertyValue('--antler').trim(),
    frost: css.getPropertyValue('--frost').trim(),
    mono: css.getPropertyValue('--mono').trim(),
  };

  // Half-width katakana, digits and a few symbols: the look of the reference image.
  const KANA = Array.from({ length: 0xFF9D - 0xFF66 + 1 }, (_, i) => String.fromCharCode(0xFF66 + i));
  const GLYPHS = KANA.concat('0123456789'.split(''), ':.=*+-<>¦|"'.split(''));
  const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = reduce ? 0.35 : 1;          // slower still if the device asks for less motion

  let W, H, size, cols, rows, streams = [];

  function colorFor(x) {
    // Blue and green mixed all the way across, with a little white. Red belongs to the tree.
    const r = Math.random();
    if (r < 0.1) return C.frost;
    return r < 0.55 ? C.ice : C.leaf;
  }

  function makeStream(col, scatter) {
    return {
      col,
      color: colorFor(col),
      // Heads start below the screen and climb; on first load they're scattered so the screen is already full.
      head: scatter ? Math.random() * (rows + 40) : rows + Math.random() * rows * 0.6,
      speed: (0.14 + Math.random() * 0.24) * SPEED,  // rows per frame at 30 fps: a steady rush, like a waterfall
      len: 24 + ((Math.random() * 46) | 0),
      cells: Array.from({ length: 60 }, pick),
      // Like a string of Christmas lights: each column changes color on its own random timer.
      swapIn: swapTimer(),
    };
  }

  // 2 to 9 seconds at 30 fps, different for every column, so the pattern never repeats.
  function swapTimer() { return 60 + ((Math.random() * 210) | 0); }

  // A different color from the one it has now: blue or green mostly, white now and then.
  function nextColor(current) {
    const options = [C.ice, C.ice, C.leaf, C.leaf, C.frost].filter(c => c !== current);
    return options[(Math.random() * options.length) | 0];
  }

  // THE TREE (Nov 23): a Christmas tree made of red code, easy to miss at a glance
  // but plain after a second, with a bright star pulsing on top. Red belongs to the
  // tree alone; outside it the columns run blue, green and white.
  let tree = null;        // 1 where a cell is inside the tree
  let treeBase = null;    // a faint red glyph in every tree cell, so the shape is always there
  let star = { x: 0, y: 0, r: 0 };
  function buildTree() {
    // Nov 23, second version: taller, a classic stepped tree. The tip narrows to
    // three columns of code right under the star, which sits near the top of the
    // screen; five tiers flare out in a sawtooth, each starting narrower than the
    // one above it ends, the way a Christmas tree is drawn; the trunk is three
    // columns wide. Edge cells glow brighter so the outline reads clearly.
    const cc = Math.floor(cols / 2), cx = cc * size + size / 2;
    const top = H * 0.075, bottom = H * 0.86, h = bottom - top;
    const half = Math.min(W * 0.42, h * 0.4);
    const ends = [0.26, 0.45, 0.64, 0.82, 1];          // each tier's widest point, as a share of `half`
    const minHalf = size * 1.1;                        // never narrower than three columns
    const mask = new Uint8Array(cols * (rows + 1));
    for (let r = 0; r <= rows; r++) {
      const y = r * size + size / 2;
      for (let c = 0; c < cols; c++) {
        const x = c * size + size / 2;
        let inside = 0;   // 1 = branches, 3 = trunk
        if (y >= top && y <= bottom) {
          const t = (y - top) / h * ends.length, i = Math.min(ends.length - 1, Math.floor(t)), local = t - i;
          const from = i === 0 ? 0 : ends[i - 1] * 0.6;
          inside = Math.abs(x - cx) <= Math.max(minHalf, half * (from + (ends[i] - from) * local)) ? 1 : 0;
        } else if (y > bottom && y <= bottom + h * 0.08) {
          inside = Math.abs(x - cx) <= size * 1.6 ? 3 : 0;   // the trunk
        }
        if (inside) mask[r * cols + c] = inside;
      }
    }
    // 2 marks an outline cell: inside, within two cells of the outside. That makes
    // the outline two characters thick, like a line drawn with a heavier pen (Nov 23).
    tree = new Uint8Array(cols * (rows + 1));
    treeBase = new Array(cols * (rows + 1));
    const at = (c, r) => c >= 0 && c < cols && r >= 0 && r <= rows && mask[r * cols + c] > 0;
    for (let r = 0; r <= rows; r++) for (let c = 0; c < cols; c++) {
      if (!at(c, r)) continue;
      // The trunk is green and solid (Nov 23): 3, never an outline cell.
      if (mask[r * cols + c] === 3) { tree[r * cols + c] = 3; treeBase[r * cols + c] = pick(); continue; }
      const edge = !at(c - 1, r) || !at(c + 1, r) || !at(c, r - 1) || !at(c, r + 1)
        || !at(c - 2, r) || !at(c + 2, r) || !at(c, r - 2) || !at(c, r + 2);
      tree[r * cols + c] = edge ? 2 : 1;
      treeBase[r * cols + c] = pick();
    }
    star = { x: cx, y: top - size * 0.4, r: size };
  }
  let twinkle = 0.5, twinkleTarget = 0.5, twinkleIn = 0;   // the star's random pulse
  const inTree = (c, r) => r >= 0 && r <= rows && tree[r * cols + c] > 0;
  // The tree's color at a cell: green in the trunk, red in the branches.
  const treeColor = (c, r) => (tree[r * cols + c] === 3 ? C.leaf : C.ember);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = canvas.getBoundingClientRect();
    W = Math.max(box.width, window.innerWidth); H = Math.max(box.height, window.innerHeight);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = Math.max(10, Math.round(Math.min(W, H) / 62));
    cols = Math.ceil(W / size); rows = Math.ceil(H / size);
    buildTree();
    if (window.WinterScene) { WinterScene.start(ctx); WinterScene.resize(W, H); }
    if (window.DetailsScene) { DetailsScene.start(ctx); DetailsScene.resize(W, H); }
    if (window.EarthSaver) { EarthSaver.start(ctx); EarthSaver.resize(W, H); }
    if (window.FaceSaver) { FaceSaver.start(ctx); FaceSaver.resize(W, H); }
    streams = [];
    for (let c = 0; c < cols; c++) {
      // Two to four streams per column, so the screen stays full.
      streams.push(makeStream(c, true));
      streams.push(makeStream(c, true));
      if (Math.random() < 0.7) streams.push(makeStream(c, true));
      if (Math.random() < 0.35) streams.push(makeStream(c, true));
    }
    ctx.font = `${size}px ${C.mono}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  }

  // TEMPO: the whole field drifts between speeds at random: slow, a bit faster,
  // faster, back to slow, and now and then a short rush. Changes ease in and out.
  let tempo = 1, target = 1, phaseLeft = 150;
  function nextPhase() {
    if (Math.random() < 0.12) {                       // a short rush: 2 to 4 seconds
      target = 2.6 + Math.random() * 0.8;
      phaseLeft = 60 + ((Math.random() * 60) | 0);
    } else {                                          // a calmer stretch: 4 to 12 seconds
      const speeds = [0.45, 0.7, 1, 1.3, 1.7];
      target = speeds[(Math.random() * speeds.length) | 0];
      phaseLeft = 120 + ((Math.random() * 240) | 0);
    }
  }

  // SCENES (V25): the Christmas display, and the Winter scene in winter.js. Swipe
  // left for Winter, right to come back (arrow keys on a computer). The iPad
  // remembers which one was showing.
  const SCENES = ['christmas', 'winter', 'details', 'kitchen'];
  if (window.GPage && GPage.enabled) SCENES.push('g');           // V69: g, one more swipe left past Kitchen, on William's iPad   // V34: Kitchen, one more swipe left past Details   // V30: Details, one more swipe left past Winter
  let scene = 'christmas';
  try { if (SCENES.includes(localStorage.getItem('risingcode_scene'))) scene = localStorage.getItem('risingcode_scene'); } catch (e) {}
  function setScene(next) {
    if (next === scene || !SCENES.includes(next)) return;
    scene = next;
    if (window.Kitchen) Kitchen.show(scene === 'kitchen');
    if (window.GPage) GPage.show(scene === 'g');
    try { localStorage.setItem('risingcode_scene', scene); } catch (e) {}
    showLabel({ christmas: (isHoliday() ? 'CHRISTMAS' : 'CODE RAIN') + ' · SWIPE LEFT FOR WINTER', winter: 'WINTER · SWIPE LEFT FOR DETAILS · RIGHT FOR CHRISTMAS', details: 'WEATHER DETAILS · SWIPE LEFT FOR KITCHEN · RIGHT FOR WINTER', kitchen: SCENES.includes('g') ? 'KITCHEN · SWIPE LEFT FOR g · RIGHT FOR WEATHER DETAILS' : 'KITCHEN · SWIPE RIGHT FOR WEATHER DETAILS', g: 'g · TAP BACK FOR KITCHEN' }[scene]);
  }
  // One scene over to the left (dir 1) or right (dir -1), stopping at the ends.
  function stepScene(dir) {
    setScene(SCENES[Math.max(0, Math.min(SCENES.length - 1, SCENES.indexOf(scene) + dir))]);
  }

  if (window.Kitchen && scene === 'kitchen') Kitchen.show(true);   // the iPad remembered Kitchen
  if (window.Kitchen) Kitchen.onBack = () => stepScene(-1);     // the Back button in Kitchen (V35)
  if (window.GPage && scene === 'g') GPage.show(true);           // the iPad remembered g (V69)
  if (window.GPage) GPage.onBack = () => stepScene(-1);
  // SCREENSAVER (V49): the first screen can be the Christmas display (tree, star, Santa,
  // radar) or a plain code-rain screensaver with none of the holiday, picked in the
  // menu. "Auto" shows Christmas from November 20 through January 6 and the plain one
  // the rest of the year.
  const SAVERS = [{ id: 'auto', name: 'Auto', note: 'CHRISTMAS NOV 20 – JAN 6' }, { id: 'christmas', name: 'Christmas', note: 'ALL YEAR' }, { id: 'classic', name: 'Code rain', note: 'NO HOLIDAY' }, { id: 'earth', name: 'Earth', note: 'GLOBE OF CODE' }, { id: 'face', name: 'Portrait', note: 'AI FACE IN AMBER' }];   // Portrait: V51, face.js   // Earth: V50, earth.js
  let saver = 'auto';
  try { if (SAVERS.some(o => o.id === localStorage.getItem('risingcode_saver'))) saver = localStorage.getItem('risingcode_saver'); } catch (e) {}
  function isHoliday(d = new Date()) {
    if (saver !== 'auto') return saver === 'christmas';
    const m = d.getMonth(), day = d.getDate();
    return (m === 10 && day >= 20) || m === 11 || (m === 0 && day <= 6);
  }
  window.Saver = { options: () => SAVERS, get: () => saver, set(id) { if (!SAVERS.some(o => o.id === id)) return; saver = id; try { localStorage.setItem('risingcode_saver', id); } catch (e) {} } };

  function draw() {
    if (scene === 'kitchen' || scene === 'g') return;   // Kitchen and g are pages of their own, nothing to draw (V34, V69)
    if (scene === 'winter' && window.WinterScene) { WinterScene.draw(); return; }
    if (scene === 'details' && window.DetailsScene) { DetailsScene.draw(); return; }
    if (saver === 'earth' && window.EarthSaver) { EarthSaver.draw(); return; }   // the Earth screensaver (V50)
    if (saver === 'face' && window.FaceSaver) { FaceSaver.draw(); return; }      // the Portrait screensaver (V51)
    tempo += (target - tempo) * 0.04;
    if (--phaseLeft <= 0) nextPhase();
    ctx.fillStyle = C.void;
    ctx.fillRect(0, 0, W, H);
    const xmas = isHoliday();
    // The tree's faint standing shape, always there under the rain (holiday only).
    if (xmas) for (let r = 0; r <= rows; r++) for (let c = 0; c < cols; c++) {
      const v = tree[r * cols + c];
      if (!v) continue;
      ctx.fillStyle = v === 3 ? C.leaf : C.ember;
      ctx.globalAlpha = v === 3 ? 1 : v === 2 ? 0.5 : 0.18;   // trunk solid and glowing, outline brighter than the inside
      if (v === 3) { ctx.shadowColor = C.leaf; ctx.shadowBlur = size * 0.6; }
      ctx.fillText(treeBase[r * cols + c], c * size + size / 2, r * size);
      if (v === 3) ctx.shadowBlur = 0;
    }
    if (Math.random() < 0.3) { const i = (Math.random() * tree.length) | 0; if (tree[i]) treeBase[i] = pick(); }
    ctx.globalAlpha = 1;
    for (const s of streams) {
      const x = s.col * size + size / 2;
      const headRow = Math.floor(s.head);
      // The trail hangs BELOW the head, because the stream is rising.
      for (let k = s.len - 1; k >= 0; k--) {
        const row = headRow + k;
        if (row < 0 || row > rows) continue;
        const fade = 1 - k / s.len;
        const red = xmas && inTree(s.col, row);   // inside the tree, every stream runs red
        ctx.globalAlpha = Math.min(1, (red ? 0.3 : 0.12) + fade * fade * 0.85);
        ctx.fillStyle = red ? treeColor(s.col, row) : s.color;
        ctx.fillText(s.cells[(row % 60 + 60) % 60], x, row * size);
      }
      // The leading glyph: bright and slightly glowing.
      if (headRow >= 0 && headRow <= rows) {
        ctx.globalAlpha = 1;
        ctx.shadowColor = xmas && inTree(s.col, headRow) ? treeColor(s.col, headRow) : s.color; ctx.shadowBlur = size * 0.8;
        ctx.fillStyle = C.frost;
        ctx.fillText(s.cells[(headRow % 60 + 60) % 60], x, headRow * size);
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;
      // Move up; now and then a glyph changes.
      s.head -= s.speed * tempo;
      if (Math.random() < 0.04) s.cells[(Math.random() * 60) | 0] = pick();
      if (--s.swapIn <= 0) { s.color = nextColor(s.color); s.swapIn = swapTimer(); }
      if (s.head + s.len < -2) Object.assign(s, makeStream(s.col, false));
    }
    // The star: a small, quick, random twinkle (Nov 23). Its largest size is a little
    // under what used to be its smallest, and the pulse is gentle. Every 0.3 to 1.2
    // seconds it picks a new brightness at random and eases toward it.
    if (!xmas) return;                             // the plain screensaver stops here: no star, radar or Santa
    if (--twinkleIn <= 0) { twinkleTarget = Math.random(); twinkleIn = 8 + ((Math.random() * 28) | 0); }
    twinkle += (twinkleTarget - twinkle) * (reduce ? 0.05 : 0.15);
    const p = twinkle;
    const R = star.r * (2.7 + 0.5 * p);
    const glow = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, R);
    glow.addColorStop(0, C.frost); glow.addColorStop(0.18, C.frost); glow.addColorStop(0.4, C.halo); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.82 + 0.18 * p; ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(star.x, star.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    drawRadar();
    drawSanta();
  }

  // SANTA (Nov 23): Santa in his sleigh behind three reindeer, Rudolph in front with
  // his red nose, flying right to left across the upper part of the screen. Drawn in
  // code like everything else, each character on a soft block of its color so the
  // shape reads from across the room. First pass 8 seconds after it opens, then every 40 to 90 seconds.
  // Letters in the pictures: A antlers, G reindeer, N Rudolph's nose, n the other
  // noses, R red, W white, S Santa's face, B the sack, h the harness, g the gold trim.
  const DEER = [
    [ // legs out
      '.A...A..........',
      '..A.A...........',
      '..AAA...........',
      '...GG...........',
      '..GGGG..........',
      'nGGGGG.........G',
      '....GGGGGGGGGGG.',
      '....GGGGGGGGGGG.',
      '....GGGGGGGGGG..',
      '...G.G.....G..G.',
      '..G...G...G....G',
    ],
    [ // legs tucked
      '.A...A..........',
      '..A.A...........',
      '..AAA...........',
      '...GG...........',
      '..GGGG..........',
      'nGGGGG.........G',
      '....GGGGGGGGGGG.',
      '....GGGGGGGGGGG.',
      '....GGGGGGGGGG..',
      '.....GG....GG...',
      '......GG..GG....',
    ],
  ];
  const SLEIGH = [
    '.........WRR...........',
    '..........RRRR.........',
    '.........WWWWWW........',
    '.........SSSSS.........',
    '........WWWWWWW...BBB..',
    '........WWWWWW...BBBBB.',
    '.......RRRRRRRR.BBBBBB.',
    'gg....ggggggggggggggggg',
    '.RRRRRRRRRRRRRRRRRRRRR.',
    '..RRRRRRRRRRRRRRRRRRR..',
    '...W..............W....',
    'WWWWWWWWWWWWWWWWWWWWWW.',
    'W......................',
  ];
  const TEAM = 3, GAP = 5, DEER_W = 16, HARNESS_ROW = 6;
  // Build both frames of the whole team as rows of letters, nose of Rudolph first.
  function teamFrame(f) {
    const deerW = DEER_W + GAP, width = TEAM * deerW + SLEIGH[0].length;
    const out = Array.from({ length: SLEIGH.length }, () => Array(width).fill('.'));
    const deerTop = SLEIGH.length - DEER[0].length - 1;   // reindeer fly a little higher than the sleigh
    for (let d = 0; d < TEAM; d++) {
      const pic = DEER[(f + d) % 2];
      pic.forEach((line, r) => [...line].forEach((ch, c) => {
        if (ch === '.') return;
        out[deerTop + r][d * deerW + c] = ch === 'n' && d === 0 ? 'N' : ch;
      }));
      // Harness from each reindeer's back to the next one behind it, and on to the sleigh.
      for (let c = d * deerW + DEER_W - 1; c < (d + 1) * deerW + 1; c++) if (out[deerTop + HARNESS_ROW][c] === '.') out[deerTop + HARNESS_ROW][c] = 'h';
    }
    for (let c = TEAM * deerW - GAP; c < TEAM * deerW + 1; c++) if (out[deerTop + HARNESS_ROW + 1][c] === '.') out[deerTop + HARNESS_ROW + 1][c] = 'h';
    SLEIGH.forEach((line, r) => [...line].forEach((ch, c) => { if (ch !== '.') out[r][TEAM * deerW + c] = ch; }));
    return out.map(row => row.join(''));
  }
  const SANTA_FRAMES = [teamFrame(0), teamFrame(1)];
  // Nov 23, V10: reindeer tan with brown antlers and harness; red sleigh with a gold
  // trim line along the top so Santa's red coat doesn't run into it; red hat with a
  // white fur brim and a white pom-pom on the tip.
  const SANTA_COLOR = { A: 'antler', G: 'tan', N: 'ember', n: 'tan', R: 'ember', W: 'snow', S: 'halo', B: 'leaf', h: 'antler', g: 'halo' };
  const santaGlyphs = SANTA_FRAMES[0].map(line => [...line].map(pick));
  // CHRISTMAS EVE (V24): every December 24, by the device's own clock, Santa is out
  // in force: the first pass comes 3 seconds after it opens and he comes back every
  // 8 to 25 seconds instead of every 30 seconds to 2 minutes. It checks the date on
  // every pass, so if it's left running it switches on at midnight and off again
  // at midnight. Adding ?eve to the address previews it on any day.
  const PREVIEW_EVE = /[?&]eve\b/.test(location.search);
  const isEve = () => { const d = new Date(); return PREVIEW_EVE || (d.getMonth() === 11 && d.getDate() === 24); };

  let tootBuf = null;
  // The first tap plays the picked sound once as a check, so it's plain right away that sound works.
  function loadToot(check) {
    if (tootBuf || !audio) return;
    tootBuf = 'loading';
    fetch(TOOT_CLIP).then(r => r.arrayBuffer())
      .then(data => new Promise((ok, no) => audio.decodeAudioData(data, ok, no)))
      .then(buf => { tootBuf = buf; if (check) playSound(); }, () => { tootBuf = null; });
  }
  function toot(t) {
    if (!tootBuf || tootBuf === 'loading') { loadToot(); return false; }
    const out = bellBus();
    const src = audio.createBufferSource(), v = audio.createGain();
    src.buffer = tootBuf; v.gain.value = 0.6;
    src.connect(v).connect(out); src.start(t);
    const w = out.wet.gain;
    const end = t + tootBuf.duration;
    w.cancelScheduledValues(t); w.setValueAtTime(0.35, t); w.setValueAtTime(0.35, end); w.linearRampToValueAtTime(0, end + 0.5);
    return true;
  }
  // V22: THREE SOUNDS, picked by tapping. Each tap after the first moves to the
  // next sound and plays it, with its name shown for a moment at the bottom. The
  // pick is remembered on this device. Whichever is picked plays once per pass,
  // the first time the radar line crosses the team.
  //   toot         the short recorded toot (above)
  //   jingle bells the opening of "Jingle Bells" (1857, public domain) on bell
  //                tones with a sleigh-bell shake on each beat (V12's sound)
  //   icicles      one quick bright shake of tiny bells (V13's sound)
  //   silent       no sound (V23)
  const SOUNDS = [
    { name: 'TOOT', play: (t) => toot(t) },
    { name: 'JINGLE BELLS', play: (t) => jingleBells(t) },
    { name: 'ICICLES', play: (t) => icicles(t) },
    { name: 'SILENT', play: () => true },        // V23: no sound at all; a pass still counts as done
  ];
  let soundPick = 0;
  try { soundPick = Math.max(0, SOUNDS.findIndex(x => x.name === localStorage.getItem('risingcode_sound'))); } catch (e) {}
  function nextSound() {
    soundPick = (soundPick + 1) % SOUNDS.length;
    try { localStorage.setItem('risingcode_sound', SOUNDS[soundPick].name); } catch (e) {}
    return SOUNDS[soundPick];
  }

  let noise = null, plain = null;
  function plainOut() {
    if (!plain) { plain = audio.createGain(); plain.gain.value = 0.5; plain.connect(audio.destination); }
    return plain;
  }
  function noiseBuf() {
    if (!noise) {
      noise = audio.createBuffer(1, audio.sampleRate * 0.2, audio.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noise;
  }
  function bell(t, freq, dur) {
    // A bell: the note plus two higher, quieter partials, struck and fading.
    [[1, 0.28], [2.76, 0.09], [5.4, 0.04]].forEach(([m, g]) => {
      const o = audio.createOscillator(), v = audio.createGain();
      o.type = 'sine'; o.frequency.value = freq * m;
      v.gain.setValueAtTime(0.0001, t);
      v.gain.exponentialRampToValueAtTime(g, t + 0.005);
      v.gain.exponentialRampToValueAtTime(0.0001, t + dur * (m === 1 ? 1 : 0.5));
      o.connect(v).connect(plainOut()); o.start(t); o.stop(t + dur + 0.05);
    });
  }
  function shake(t) {
    // Sleigh bells: a quick bright rattle of filtered noise.
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), v = audio.createGain();
    src.buffer = noiseBuf(); f.type = 'bandpass'; f.frequency.value = 7000; f.Q.value = 1.2;
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(0.12, t + 0.004);
    v.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    src.connect(f).connect(v).connect(plainOut()); src.start(t); src.stop(t + 0.15);
  }
  function jingleBells(t0) {
    const E = 659.25, G = 783.99, Cn = 523.25, D = 587.33, beat = 0.2;
    const tune = [[E, 1], [E, 1], [E, 2], [E, 1], [E, 1], [E, 2], [E, 1], [G, 1], [Cn, 1.5], [D, 0.5], [E, 4]];
    let t = t0;
    for (const [f, n] of tune) { bell(t, f, Math.max(0.35, n * beat * 1.6)); t += n * beat; }
    for (let b = t0; b < t; b += beat) shake(b);
    return true;
  }
  function ping(t, gain) {
    // One tiny bell in the cluster: a short bright ping with a little metallic hiss.
    const f = 2600 + Math.random() * 3200;
    [[1, 1], [1.51, 0.5], [2.37, 0.3]].forEach(([m, g]) => {
      const o = audio.createOscillator(), v = audio.createGain();
      o.type = 'sine'; o.frequency.value = f * m;
      v.gain.setValueAtTime(0.0001, t);
      v.gain.exponentialRampToValueAtTime(gain * g, t + 0.002);
      v.gain.exponentialRampToValueAtTime(0.0001, t + 0.09 + Math.random() * 0.08);
      o.connect(v).connect(audio.destination); o.start(t); o.stop(t + 0.2);
    });
    const src = audio.createBufferSource(), bp = audio.createBiquadFilter(), v = audio.createGain();
    src.buffer = noiseBuf(); bp.type = 'bandpass'; bp.frequency.value = 8000; bp.Q.value = 2;
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(gain * 0.5, t + 0.002);
    v.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(bp).connect(v).connect(audio.destination); src.start(t); src.stop(t + 0.08);
  }
  function icicles(t0) {
    for (let i = 0; i < 22; i++) {
      const at = Math.pow(Math.random(), 1.6) * 0.5;        // bunched at the start
      ping(t0 + at, 0.09 * (1 - at * 1.3));
    }
    return true;
  }
  function playSound() { return SOUNDS[soundPick].play(audio.currentTime + 0.05); }
  // The swipe-down menu (menu.js) can pick the sound too, and plays it when picked (V32).
  if (window.Menu) Menu.connect({
    names: SOUNDS.map(s => s.name),
    get: () => soundPick,
    set: (i) => {
      soundPick = i;
      try { localStorage.setItem('risingcode_sound', SOUNDS[i].name); } catch (e) {}
      if (!audio) unlockAudio(); else { if (audio.state !== 'running') { try { audio.resume(); } catch (e) {} } playSound(); }
    },
  });

  function jingle() {
    if (!audio || !santa || santa.rang) return;
    // An iPad puts the sound to sleep after the screen dims or the app goes to the
    // background ("interrupted"); wake it and try again on the next frame (V20).
    if (audio.state !== 'running') { try { audio.resume(); } catch (e) {} return; }
    if (playSound()) santa.rang = true;                     // once per pass, only once it has actually played
  }

  // 30 frames a second is plenty for something this slow, and easier on the battery.
  let last = 0;
  function loop(t) {
    if (t - last >= 33) { draw(); last = t; }
    requestAnimationFrame(loop);
  }

  // Keep the screen awake while it's showing, where the device allows it.
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch (e) { lock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (audio) { try { audio.resume(); } catch (e) {} } } });

  // Tap toggles full screen where the browser allows it; the hint fades either way.
  // First tap: full screen, sound on, and the picked sound plays once as a check.
  // Every tap after that switches to the next sound and plays it (V22). Full screen
  // is left alone after the first tap; the iPad's own controls close it.
  let tapped = false, labelTimer = null;
  function showLabel(text) {
    hint.textContent = text; hint.classList.remove('gone');
    clearTimeout(labelTimer); labelTimer = setTimeout(() => hint.classList.add('gone'), 1800);
  }
  // A swipe is a sideways drag of at least 60 pixels; anything less is a tap.
  let downX = null, downY = null, swipedAt = 0;
  // The menu swipe has to start below the top strip of the screen, so it never competes with
  // the iPad's own pull-down from the top edge (Notification Center). Closing works anywhere (V33).
  const MENU_SWIPE_MIN_Y = () => Math.max(120, window.innerHeight * 0.2);
  let downFromTop = false;
  let fromMiddle = false;   // V80: a swipe up that starts in the middle of the screen brings up the radio (radio.js); never from the bottom edge, which is the iPad's own
  // A drag that starts in Kitchen's text box or results is that page's own (selecting, scrolling): never a swipe.
  const inKitchenContent = (t) => !!(t && t.closest && t.closest('#kitchen input'));
  // On iPad, Safari can take over a vertical drag on Kitchen's scrollable page and cancel the touch,
  // so the menu swipe must not wait for touchend (V35). A drag that starts while Kitchen's results are
  // scrolled down is a scroll, not a menu swipe.
  const kitchenScrolled = () => { const k = document.getElementById('kitchen'); return scene === 'kitchen' && !!k && k.scrollTop > 0; };
  const MENU_CLOSE_DY = 140;                      // V70: how far up a swipe must go to close the menu
  let lastX = 0, lastY = 0, scrolledStart = false, menuEndStart = false;
  const swipeStart = (x, y, t) => { downX = inKitchenContent(t) && scene === 'kitchen' ? null : x; downY = y; lastX = x; lastY = y; scrolledStart = kitchenScrolled(); downFromTop = y < MENU_SWIPE_MIN_Y(); fromMiddle = y > window.innerHeight * 0.25 && y < window.innerHeight * 0.8 && x > window.innerWidth * 0.15 && x < window.innerWidth * 0.85; menuEndStart = !!(window.Menu && Menu.isOpen() && Menu.atBottom()); };
  const swipeMove = (x, y) => {
    if (downX === null) return;
    lastX = x; lastY = y;
    const dx = x - downX, dy = y - downY;
    if (dy >= 80 && dy > Math.abs(dx) * 1.5 && window.Menu && !Menu.isOpen() && !downFromTop && !scrolledStart) swipeEnd(x, y);   // open mid-drag
    // Close mid-drag too (V36): Safari can cancel an upward drag on the menu's scrollable layer. If the menu is
    // taller than the screen and not scrolled to its end, the drag is a scroll; the ✕ button still closes.
    // V70: only when the menu was already at its very end when the finger went down, and a longer swipe;
    // otherwise an upward drag scrolls the menu (William couldn't read the verses: it kept closing).
    if (dy <= -MENU_CLOSE_DY && -dy > Math.abs(dx) * 1.5 && window.Menu && Menu.isOpen() && menuEndStart) swipeEnd(x, y);
  };
  const swipeEnd = (x, y) => {
    if (downX === null) return;
    const dx = x - downX, dy = y - downY; downX = null;
    // Swipe down on any scene opens the menu; swipe up closes it (V32).
    if (window.Menu && Math.abs(dy) >= 80 && Math.abs(dy) > Math.abs(dx) * 1.5) {
      swipedAt = Date.now();
      if (dy > 0 && !Menu.isOpen()) { if (!downFromTop && !scrolledStart) Menu.open(); }
      else if (dy < 0 && Menu.isOpen() && menuEndStart && -dy >= MENU_CLOSE_DY) Menu.close();
      else if (dy < 0 && !Menu.isOpen() && fromMiddle && !scrolledStart && window.Radio) Radio.open();
      return;
    }
    if (window.Menu && Menu.isOpen()) return;
    if (Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swipedAt = Date.now();
      // On Winter, a swipe that starts on a weather-alert banner dismisses the alert (V29).
      if (scene === 'winter' && window.WinterScene && WinterScene.swipeOnBanner(x - dx, y - dy, dx)) return;
      stepScene(dx < 0 ? 1 : -1);
    }
  };
  document.addEventListener('touchstart', (e) => { const p = e.changedTouches[0]; swipeStart(p.clientX, p.clientY, e.target); }, { passive: true });
  document.addEventListener('touchmove', (e) => { const p = e.changedTouches[0]; swipeMove(p.clientX, p.clientY); }, { passive: true });
  document.addEventListener('touchcancel', () => swipeEnd(lastX, lastY), { passive: true });
  document.addEventListener('touchend', (e) => { const p = e.changedTouches[0]; swipeEnd(p.clientX, p.clientY); }, { passive: true });
  document.addEventListener('mousedown', (e) => swipeStart(e.clientX, e.clientY, e.target));
  document.addEventListener('mouseup', (e) => swipeEnd(e.clientX, e.clientY));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && window.Menu) Menu.open();
    if (e.key === 'ArrowUp' && window.Radio && window.Menu && !Menu.isOpen()) { Radio.open(); return; }
    if ((e.key === 'ArrowUp' || e.key === 'Escape') && window.Menu) Menu.close();
    if (window.Menu && Menu.isOpen()) return;
    if (e.key === 'ArrowLeft') stepScene(1);
    if (e.key === 'ArrowRight') stepScene(-1);
  });

  document.addEventListener('click', async (e) => {
    if (Date.now() - swipedAt < 500) return;      // the end of a swipe isn't a tap
    if (window.Menu && Menu.isOpen()) return;
    keepAwake();
    // On Details a tap does nothing but go full screen (V30).
    if (scene === 'details') {
      hint.classList.add('gone');
      try { const el = document.documentElement; if (!(document.fullscreenElement || document.webkitFullscreenElement)) await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e2) {}
      return;
    }
    // On the Winter scene a tap opens or closes the three-day forecast, with no sound (V27).
    if (scene === 'winter' && window.WinterScene) {
      hint.classList.add('gone');
      WinterScene.tap(e.clientX, e.clientY);
      try {
        const el = document.documentElement;
        if (!(document.fullscreenElement || document.webkitFullscreenElement)) await (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } catch (e) {}
      return;
    }
    // On the plain screensaver a tap just goes full screen; sounds belong to Christmas (V49).
    if (scene === 'christmas' && !isHoliday()) {
      hint.classList.add('gone');
      try { const el = document.documentElement; if (!(document.fullscreenElement || document.webkitFullscreenElement)) await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e3) {}
      return;
    }
    if (tapped && audio) {
      if (audio.state !== 'running') { try { audio.resume(); } catch (e) {} }
      const s = nextSound();
      showLabel('SOUND: ' + s.name);
      playSound();
      return;
    }
    tapped = true;
    hint.classList.add('gone');
    unlockAudio();
    try {
      const el = document.documentElement;
      const full = document.fullscreenElement || document.webkitFullscreenElement;
      if (!full) await (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) { /* not available here; it still runs full-window */ }
  });
  if (!isHoliday()) hint.textContent = hint.textContent.replace('TAP FOR SOUND · ', '');   // the plain screensaver has no sound (V49)
  if (isEve()) hint.textContent = 'CHRISTMAS EVE · SANTA IS OUT TONIGHT · TAP FOR SOUND';
  setTimeout(() => hint.classList.add('gone'), isEve() ? 8000 : 5000);

  window.addEventListener('resize', resize);
  resize(); draw(); keepAwake();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
