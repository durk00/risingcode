<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rising Code">
<meta name="theme-color" content="#000000">
<title>Rising Code</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* One full-screen canvas; nothing else on the page but a hint that fades. Deliberately single dark look. */
  :root {
    --void: #000000;     /* the background */
    --ice: #46b8e6;      /* cyan-blue streams */
    --leaf: #3fe08f;     /* green streams */
    --ember: #ff5059;
    --halo: #ffe7a3;     /* the star's warm glow */    /* red streams: darker than the green, so the two differ in brightness too */
    --frost: #dff4ff;    /* pale streams and the bright leading glyph */
    --hint: #8fa9b8;     /* the fading tap hint */
    --mono: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Osaka", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--frost); overflow: hidden; }
  /* Home-screen app on an iPhone or iPad (Nov 23): the page starts under the status bar, but
     iOS reports the screen as shorter by the status bar's height, which left an empty black
     band at the bottom. The canvas reaches that much further down, and is drawn at its real size. */
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: calc(100vh + env(safe-area-inset-top, 0px)); min-height: 100%; display: block; background: var(--void); }
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center; font: 500 13px/1.4 var(--mono); letter-spacing: 0.12em;
    color: var(--hint); opacity: 0.9; transition: opacity 2s ease; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="rain" aria-label="Rising columns of glowing code in blue, green and white, with a red Christmas tree and a pulsing star"></canvas>
<!-- The version shows in the hint for five seconds, so an old cached copy is easy to spot (Nov 23). -->
<div id="hint">TAP FOR FULL SCREEN · TREE V4</div>

<script>
(() => {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const css = getComputedStyle(document.documentElement);
  const C = {
    void: css.getPropertyValue('--void').trim(),
    ice: css.getPropertyValue('--ice').trim(),
    leaf: css.getPropertyValue('--leaf').trim(),
    ember: css.getPropertyValue('--ember').trim(),
    halo: css.getPropertyValue('--halo').trim(),
    frost: css.getPropertyValue('--frost').trim(),
    mono: css.getPropertyValue('--mono').trim(),
  };

  // Half-width katakana, digits and a few symbols: the look of the reference image.
  const KANA = Array.from({ length: 0xFF9D - 0xFF66 + 1 }, (_, i) => String.fromCharCode(0xFF66 + i));
  const GLYPHS = KANA.concat('0123456789'.split(''), ':.=*+-<>¦|"'.split(''));
  const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = reduce ? 0.35 : 1;          // slower still if the device asks for less motion

  let W, H, size, cols, rows, streams = [];

  function colorFor(x) {
    // Blue and green mixed all the way across, with a little white. Red belongs to the tree.
    const r = Math.random();
    if (r < 0.1) return C.frost;
    return r < 0.55 ? C.ice : C.leaf;
  }

  function makeStream(col, scatter) {
    return {
      col,
      color: colorFor(col),
      // Heads start below the screen and climb; on first load they're scattered so the screen is already full.
      head: scatter ? Math.random() * (rows + 40) : rows + Math.random() * rows * 0.6,
      speed: (0.14 + Math.random() * 0.24) * SPEED,  // rows per frame at 30 fps: a steady rush, like a waterfall
      len: 24 + ((Math.random() * 46) | 0),
      cells: Array.from({ length: 60 }, pick),
      // Like a string of Christmas lights: each column changes color on its own random timer.
      swapIn: swapTimer(),
    };
  }

  // 2 to 9 seconds at 30 fps, different for every column, so the pattern never repeats.
  function swapTimer() { return 60 + ((Math.random() * 210) | 0); }

  // A different color from the one it has now: blue or green mostly, white now and then.
  function nextColor(current) {
    const options = [C.ice, C.ice, C.leaf, C.leaf, C.frost].filter(c => c !== current);
    return options[(Math.random() * options.length) | 0];
  }

  // THE TREE (Nov 23): a Christmas tree made of red code, easy to miss at a glance
  // but plain after a second, with a bright star pulsing on top. Red belongs to the
  // tree alone; outside it the columns run blue, green and white.
  let tree = null;        // 1 where a cell is inside the tree
  let treeBase = null;    // a faint red glyph in every tree cell, so the shape is always there
  let star = { x: 0, y: 0, r: 0 };
  function buildTree() {
    // Nov 23, second version: taller, a classic stepped tree. The tip narrows to
    // three columns of code right under the star, which sits near the top of the
    // screen; five tiers flare out in a sawtooth, each starting narrower than the
    // one above it ends, the way a Christmas tree is drawn; the trunk is three
    // columns wide. Edge cells glow brighter so the outline reads clearly.
    const cc = Math.floor(cols / 2), cx = cc * size + size / 2;
    const top = H * 0.075, bottom = H * 0.86, h = bottom - top;
    const half = Math.min(W * 0.42, h * 0.4);
    const ends = [0.26, 0.45, 0.64, 0.82, 1];          // each tier's widest point, as a share of `half`
    const minHalf = size * 1.1;                        // never narrower than three columns
    const mask = new Uint8Array(cols * (rows + 1));
    for (let r = 0; r <= rows; r++) {
      const y = r * size + size / 2;
      for (let c = 0; c < cols; c++) {
        const x = c * size + size / 2;
        let inside = 0;   // 1 = branches, 3 = trunk
        if (y >= top && y <= bottom) {
          const t = (y - top) / h * ends.length, i = Math.min(ends.length - 1, Math.floor(t)), local = t - i;
          const from = i === 0 ? 0 : ends[i - 1] * 0.6;
          inside = Math.abs(x - cx) <= Math.max(minHalf, half * (from + (ends[i] - from) * local)) ? 1 : 0;
        } else if (y > bottom && y <= bottom + h * 0.08) {
          inside = Math.abs(x - cx) <= size * 1.6 ? 3 : 0;   // the trunk
        }
        if (inside) mask[r * cols + c] = inside;
      }
    }
    // 2 marks an outline cell: inside, within two cells of the outside. That makes
    // the outline two characters thick, like a line drawn with a heavier pen (Nov 23).
    tree = new Uint8Array(cols * (rows + 1));
    treeBase = new Array(cols * (rows + 1));
    const at = (c, r) => c >= 0 && c < cols && r >= 0 && r <= rows && mask[r * cols + c] > 0;
    for (let r = 0; r <= rows; r++) for (let c = 0; c < cols; c++) {
      if (!at(c, r)) continue;
      // The trunk is green and solid (Nov 23): 3, never an outline cell.
      if (mask[r * cols + c] === 3) { tree[r * cols + c] = 3; treeBase[r * cols + c] = pick(); continue; }
      const edge = !at(c - 1, r) || !at(c + 1, r) || !at(c, r - 1) || !at(c, r + 1)
        || !at(c - 2, r) || !at(c + 2, r) || !at(c, r - 2) || !at(c, r + 2);
      tree[r * cols + c] = edge ? 2 : 1;
      treeBase[r * cols + c] = pick();
    }
    star = { x: cx, y: top - size * 0.4, r: size };
  }
  const inTree = (c, r) => r >= 0 && r <= rows && tree[r * cols + c] > 0;
  // The tree's color at a cell: green in the trunk, red in the branches.
  const treeColor = (c, r) => (tree[r * cols + c] === 3 ? C.leaf : C.ember);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = canvas.getBoundingClientRect();
    W = Math.max(box.width, window.innerWidth); H = Math.max(box.height, window.innerHeight);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = Math.max(10, Math.round(Math.min(W, H) / 62));
    cols = Math.ceil(W / size); rows = Math.ceil(H / size);
    buildTree();
    streams = [];
    for (let c = 0; c < cols; c++) {
      // Two to four streams per column, so the screen stays full.
      streams.push(makeStream(c, true));
      streams.push(makeStream(c, true));
      if (Math.random() < 0.7) streams.push(makeStream(c, true));
      if (Math.random() < 0.35) streams.push(makeStream(c, true));
    }
    ctx.font = `${size}px ${C.mono}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  }

  // TEMPO: the whole field drifts between speeds at random: slow, a bit faster,
  // faster, back to slow, and now and then a short rush. Changes ease in and out.
  let tempo = 1, target = 1, phaseLeft = 150;
  function nextPhase() {
    if (Math.random() < 0.12) {                       // a short rush: 2 to 4 seconds
      target = 2.6 + Math.random() * 0.8;
      phaseLeft = 60 + ((Math.random() * 60) | 0);
    } else {                                          // a calmer stretch: 4 to 12 seconds
      const speeds = [0.45, 0.7, 1, 1.3, 1.7];
      target = speeds[(Math.random() * speeds.length) | 0];
      phaseLeft = 120 + ((Math.random() * 240) | 0);
    }
  }

  function draw() {
    tempo += (target - tempo) * 0.04;
    if (--phaseLeft <= 0) nextPhase();
    ctx.fillStyle = C.void;
    ctx.fillRect(0, 0, W, H);
    // The tree's faint standing shape, always there under the rain.
    for (let r = 0; r <= rows; r++) for (let c = 0; c < cols; c++) {
      const v = tree[r * cols + c];
      if (!v) continue;
      ctx.fillStyle = v === 3 ? C.leaf : C.ember;
      ctx.globalAlpha = v === 3 ? 1 : v === 2 ? 0.5 : 0.18;   // trunk solid and glowing, outline brighter than the inside
      if (v === 3) { ctx.shadowColor = C.leaf; ctx.shadowBlur = size * 0.6; }
      ctx.fillText(treeBase[r * cols + c], c * size + size / 2, r * size);
      if (v === 3) ctx.shadowBlur = 0;
    }
    if (Math.random() < 0.3) { const i = (Math.random() * tree.length) | 0; if (tree[i]) treeBase[i] = pick(); }
    ctx.globalAlpha = 1;
    for (const s of streams) {
      const x = s.col * size + size / 2;
      const headRow = Math.floor(s.head);
      // The trail hangs BELOW the head, because the stream is rising.
      for (let k = s.len - 1; k >= 0; k--) {
        const row = headRow + k;
        if (row < 0 || row > rows) continue;
        const fade = 1 - k / s.len;
        const red = inTree(s.col, row);   // inside the tree, every stream runs red
        ctx.globalAlpha = Math.min(1, (red ? 0.3 : 0.12) + fade * fade * 0.85);
        ctx.fillStyle = red ? treeColor(s.col, row) : s.color;
        ctx.fillText(s.cells[(row % 60 + 60) % 60], x, row * size);
      }
      // The leading glyph: bright and slightly glowing.
      if (headRow >= 0 && headRow <= rows) {
        ctx.globalAlpha = 1;
        ctx.shadowColor = inTree(s.col, headRow) ? treeColor(s.col, headRow) : s.color; ctx.shadowBlur = size * 0.8;
        ctx.fillStyle = C.frost;
        ctx.fillText(s.cells[(headRow % 60 + 60) % 60], x, headRow * size);
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;
      // Move up; now and then a glyph changes.
      s.head -= s.speed * tempo;
      if (Math.random() < 0.04) s.cells[(Math.random() * 60) | 0] = pick();
      if (--s.swapIn <= 0) { s.color = nextColor(s.color); s.swapIn = swapTimer(); }
      if (s.head + s.len < -2) Object.assign(s, makeStream(s.col, false));
    }
    // The star: larger and brighter than anything else, pulsing slowly at the top.
    const p = 0.5 + 0.5 * Math.sin(performance.now() / (reduce ? 1400 : 700));
    const R = star.r * (3.4 + 1.8 * p);
    const glow = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, R);
    glow.addColorStop(0, C.frost); glow.addColorStop(0.18, C.frost); glow.addColorStop(0.4, C.halo); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.75 + 0.25 * p; ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(star.x, star.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 30 frames a second is plenty for something this slow, and easier on the battery.
  let last = 0;
  function loop(t) {
    if (t - last >= 33) { draw(); last = t; }
    requestAnimationFrame(loop);
  }

  // Keep the screen awake while it's showing, where the device allows it.
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch (e) { lock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  // Tap toggles full screen where the browser allows it; the hint fades either way.
  document.addEventListener('click', async () => {
    hint.classList.add('gone');
    keepAwake();
    try {
      const el = document.documentElement;
      const full = document.fullscreenElement || document.webkitFullscreenElement;
      if (full) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else await (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) { /* not available here; it still runs full-window */ }
  });
  setTimeout(() => hint.classList.add('gone'), 5000);

  window.addEventListener('resize', resize);
  resize(); draw(); keepAwake();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
